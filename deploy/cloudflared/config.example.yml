# Locally managed Cloudflare Tunnel for the Mac that runs Oh baby baby!
# Docs: https://developers.cloudflare.com/tunnel/features/locally-managed-tunnels/create-local-tunnel/
#
# Replace TUNNEL_UUID and the credentials path with the output of
# `cloudflared tunnel create oh-baby-baby`.
# `url` is the Go server started by scripts/mac-serve.sh (API + web on one port).

tunnel: TUNNEL_UUID
credentials-file: /Users/YOU/.cloudflared/TUNNEL_UUID.json
url: http://127.0.0.1:47221
