server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    gzip on;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/plain;
    gzip_min_length 1024;

    include mime.types;

    location /v1/ {
        proxy_pass http://127.0.0.1:47220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:47220/healthz;
        proxy_set_header Host $host;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
