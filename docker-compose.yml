services:
  duckdb:
    build:
      context: ./deploy/duckdb
    image: ohbaby-duckdb
    environment:
      DUCKDB_QUACK_TOKEN: ${DUCKDB_QUACK_TOKEN:-dev-only-not-for-production}
      DUCKDB_PATH: /data/ohbaby.duckdb
      HOME: /data
    volumes:
      - ohbaby-data:/data
    ports:
      - "47221:80"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    image: ohbaby-web
    network_mode: service:duckdb
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    image: ohbaby-api
    network_mode: service:duckdb
    environment:
      OHBABY_ADDR: ":47220"
      OHBABY_DB: quack:127.0.0.1:9494
      DUCKDB_QUACK_TOKEN: ${DUCKDB_QUACK_TOKEN:-dev-only-not-for-production}
      OHBABY_JWT_SECRET: ${OHBABY_JWT_SECRET:-dev-only-not-for-production}
      OHBABY_APP_ORIGINS: ${OHBABY_APP_ORIGINS:-http://127.0.0.1:47221,http://localhost:47221}
      OHBABY_ALLOWED_ORIGINS: ${OHBABY_ALLOWED_ORIGINS:-http://127.0.0.1:47221,http://localhost:47221}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
    depends_on:
      duckdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ohbaby-data:
