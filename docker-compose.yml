services:
  # Official image from https://duckdb.org/docs/lts/operations_manual/duckdb_docker
  # (docker run -v …:/workspace -w /workspace duckdb/duckdb). The published tag is
  # current DuckDB (1.5.6 here), which includes the Quack server.
  duckdb:
    image: duckdb/duckdb
    entrypoint: ["/duckdb"]
    command:
      - -unsigned
      - -interactive
      - -cmd
      - INSTALL quack; LOAD quack; CALL quack_serve('quack:0.0.0.0:9494', token := '${DUCKDB_QUACK_TOKEN:-dev-only-not-for-production}', allow_other_hostname => true);
      - /workspace/ohbaby.duckdb
    stdin_open: true
    working_dir: /workspace
    environment:
      HOME: /workspace
    volumes:
      - ohbaby-data:/workspace
    ports:
      - "47221:80"
    healthcheck:
      test:
        - CMD
        - /duckdb
        - -unsigned
        - -c
        - LOAD quack; FROM quack_query('quack:127.0.0.1:9494', 'SELECT 1', token := '${DUCKDB_QUACK_TOKEN:-dev-only-not-for-production}', disable_ssl := true);
      interval: 15s
      timeout: 20s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    image: ohbaby-web
    environment:
      PORT: "80"
      API_UPSTREAM: 127.0.0.1:47220
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    network_mode: service:duckdb
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    image: ohbaby-api
    network_mode: service:duckdb
    environment:
      OHBABY_ADDR: ":47220"
      OHBABY_DB: quack:127.0.0.1:9494
      DUCKDB_QUACK_TOKEN: ${DUCKDB_QUACK_TOKEN:-dev-only-not-for-production}
      OHBABY_JWT_SECRET: ${OHBABY_JWT_SECRET:-dev-only-not-for-production}
      OHBABY_APP_ORIGINS: ${OHBABY_APP_ORIGINS:-http://127.0.0.1:47221,http://localhost:47221}
      OHBABY_ALLOWED_ORIGINS: ${OHBABY_ALLOWED_ORIGINS:-http://127.0.0.1:47221,http://localhost:47221}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
    depends_on:
      duckdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ohbaby-data:
